<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kimi-K3 optimization loop · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub {
      font-family: var(--font-sans);
      font-size: 0.9rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Kimi-K3 optimization loop</p>
    <h1>Profile → simulate → optimize: three containers, one decoder layer</h1>
    <p class="sub">The agent edits a copy of sglang, measures with the layer driver, and reads VibeSim's roofline ladder; the judge re-measures against a pristine tree it alone controls.</p>

    <svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="k3-loop-title k3-loop-desc">
      <title id="k3-loop-title">Kimi-K3 optimization loop: agent, eval harness, VibeSim oracle</title>
      <desc id="k3-loop-desc">Architecture diagram showing a Codex agent that queries the VibeSim oracle, edits a copy of the sglang tree, and runs the single-layer driver, while an independent judge replays the agent's source diff against a pristine tree and goldens to issue a PASS or FAIL.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zones (drawn first) -->
      <!-- 03 · Agent -->
      <rect x="40" y="72" width="272" height="248" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="112" y="76" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="176" y="85" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">03 · AGENT CONTAINER</text>

      <!-- 02 · VibeSim oracle -->
      <rect x="688" y="72" width="272" height="248" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="752" y="76" width="144" height="12" rx="2" fill="#f5f5f5"/>
      <text x="824" y="85" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">02 · VIBESIM CONTAINER</text>

      <!-- 01 · Eval harness -->
      <rect x="40" y="368" width="920" height="168" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="360" y="372" width="280" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="381" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">01 · EVAL HARNESS · SGLANG v0.5.20 · ONE B200</text>

      <!-- Arrows (before nodes) -->
      <!-- A1 agent -> oracle (HTTP, read-only) -->
      <line x1="256" y1="140" x2="712" y2="140" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="440" y="120" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="484" y="129" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">QUERY LADDER</text>

      <!-- A2 oracle -> baked prediction -->
      <line x1="824" y1="184" x2="824" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="836" y="196" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="866" y="205" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PREBAKED</text>

      <!-- A3 agent -> edited tree -->
      <line x1="160" y1="184" x2="160" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="172" y="196" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="188" y="205" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EDIT</text>

      <!-- A4 agent -> driver (primary flow: measure) -->
      <path d="M 256,168 H 292 Q 300,168 300,176 V 416" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="308" y="292" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="340" y="301" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MEASURE</text>

      <!-- A5 edited tree -> driver (imported from source) -->
      <line x1="160" y1="288" x2="160" y2="416" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="172" y="344" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="196" y="353" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IMPORT</text>

      <!-- A6 edited tree -> judge (source diff), hops over A4 at x=300 -->
      <path d="M 256,256 H 292 a 8,8 0 0,1 16,0 H 496 Q 504,256 504,264 V 416" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="360" y="236" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="402" y="245" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SOURCE DIFF</text>

      <!-- A7 judge -> driver (re-measure, 5 reps) -->
      <line x1="400" y1="472" x2="320" y2="472" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="336" y="452" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="360" y="461" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">5 REPS</text>

      <!-- A8 pristine + goldens -> judge (baseline) -->
      <line x1="744" y1="456" x2="608" y2="456" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="644" y="436" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="676" y="445" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BASELINE</text>

      <!-- Nodes -->
      <!-- Codex agent (focal) -->
      <rect x="64" y="112" width="192" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="112" width="192" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="72" y="120" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="86" y="129" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
      <text x="160" y="152" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Codex agent</text>
      <text x="160" y="168" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gpt-5.6-luna · edits python/sglang/**</text>

      <!-- Edited sglang tree (store) -->
      <rect x="64" y="224" width="192" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="224" width="192" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="72" y="232" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="88" y="241" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TREE</text>
      <text x="160" y="260" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Edited sglang tree</text>
      <text x="160" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bind-mounted copy · .py + JIT .cuh</text>

      <!-- VibeSim oracle -->
      <rect x="712" y="112" width="224" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="712" y="112" width="224" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="720" y="120" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="734" y="129" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="824" y="152" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">VibeSim oracle</text>
      <text x="824" y="168" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">optimality R0→R7 · kernels · analyze</text>

      <!-- Baked prediction (store) -->
      <rect x="712" y="224" width="224" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="712" y="224" width="224" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="720" y="232" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="734" y="241" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="824" y="260" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Baked K3 prediction</text>
      <text x="824" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">arch kimi_k3_sglang · B200 profile.db rows</text>

      <!-- Layer driver -->
      <rect x="64" y="416" width="256" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="416" width="256" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="72" y="424" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="96" y="433" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXTRACT</text>
      <text x="192" y="456" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Single-layer driver</text>
      <text x="192" y="472" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">1 KimiK3DecoderLayer · CUDA-graph µs</text>
      <text x="192" y="486" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">capture / replay · kernel table</text>

      <!-- Judge -->
      <rect x="400" y="416" width="208" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="400" y="416" width="208" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="408" y="424" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="424" y="433" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GATE</text>
      <text x="504" y="456" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Judge</text>
      <text x="504" y="472" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Δ ≥ max(5%, 3σ) ∧ output+state match</text>
      <text x="504" y="486" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">→ trial_k_verdict.json</text>

      <!-- Pristine tree + goldens (store) -->
      <rect x="744" y="424" width="192" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="744" y="424" width="192" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="752" y="432" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="766" y="441" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REF</text>
      <text x="840" y="460" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pristine tree + goldens</text>
      <text x="840" y="476" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">judge-owned · never seen by the agent</text>

      <!-- Legend strip -->
      <line x1="40" y1="576" x2="960" y2="576" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="592" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="608" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="616" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal / the optimizer</text>

      <rect x="200" y="608" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="220" y="616" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Service / step</text>

      <rect x="340" y="608" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="360" y="616" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Store / artifact</text>

      <line x1="480" y1="613" x2="508" y2="613" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="516" y="616" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Read-only HTTP</text>

      <line x1="640" y1="613" x2="668" y2="613" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="676" y="616" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Primary measurement</text>

      <line x1="820" y1="613" x2="848" y2="613" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="856" y="616" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Data / control</text>
    </svg>
  </div>
